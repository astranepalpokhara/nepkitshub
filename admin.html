<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Nepkits Hub</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/">NEPKITS HUB</a><button onclick="logout()">Logout</button></header><main><section><h1>Admin Dashboard</h1><div id="stats" class="grid"></div></section><section><h2>Store branding & payment</h2><form id="settings"><input name="logo" placeholder="Logo image URL" style="padding:12px;width:100%;margin:6px 0"><input name="paymentQr" placeholder="eSewa QR image URL" style="padding:12px;width:100%;margin:6px 0"><input name="storeName" placeholder="Store name" style="padding:12px;width:100%;margin:6px 0"><input name="tagline" placeholder="Tagline" style="padding:12px;width:100%;margin:6px 0"><button>Save settings</button></form></section><section><h2>Add product</h2><form id="product"><input name="name" placeholder="Product name" required style="padding:12px;width:100%;margin:6px 0"><input name="cat" placeholder="Category" style="padding:12px;width:100%;margin:6px 0"><input name="price" type="number" placeholder="Price" style="padding:12px;width:100%;margin:6px 0"><input name="stock" type="number" placeholder="Stock" style="padding:12px;width:100%;margin:6px 0"><input name="image" placeholder="Product photo URL" style="padding:12px;width:100%;margin:6px 0"><button>Add product</button></form></section><section><h2>Orders</h2><div id="orders"></div></section></main><script>const H={Authorization:'Bearer '+localStorage.token,'Content-Type':'application/json'};async function api(u,o={}){o.headers={...H,...o.headers};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}async function load(){try{let s=await api('/api/admin/stats');stats.innerHTML=Object.entries(s).map(([k,v])=>`<article style="padding:20px;border:1px solid #ddd;border-radius:15px"><b>${k}</b><h2>${v}</h2></article>`).join('');let st=await api('/api/store/settings');for(let k of ['logo','paymentQr','storeName','tagline'])settings[k].value=st[k]||'';let os=await api('/api/admin/orders');orders.innerHTML=os.map(o=>`<article style="padding:16px;border-bottom:1px solid #ddd"><b>${o.id}</b> · ${o.customer?.name||''} · Rs. ${o.total}<select onchange="status('${o.id}',this.value)"><option>${o.status}</option><option>Payment verified</option><option>Preparing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></article>`).join('')||'No orders yet'}catch(e){location.href='login.html'}}settings.onsubmit=async e=>{e.preventDefault();await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(settings)))});alert('Settings saved')};product.onsubmit=async e=>{e.preventDefault();await api('/api/admin/products',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(product)))});product.reset();load()};async function status(id,status){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}function logout(){localStorage.removeItem('token');location.href='login.html'}load()</script></body></html>
