<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nepkits Hub</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/">NEPKITS HUB</a><nav><a href="#products">Shop</a><a href="login.html">Login</a><a href="admin.html">Admin</a></nav></header><main><section class="hero"><div><p>JERSEYS • STREETWEAR • NEPAL</p><h1>Wear the game.<br><span>Own the look.</span></h1><a class="btn" href="#products">Shop now</a></div><div class="hero-card">NEPKITS<br>HUB</div></section><section id="products"><h2>Featured products</h2><div id="grid" class="grid"></div></section></main><footer>Nepkits Hub · Jerseys. Streetwear. Nepal.</footer><script>fetch('/api/products').then(r=>r.json()).then(ps=>grid.innerHTML=ps.map(p=>`<article><div class="pic">${p.image?`<img src="${p.image}">`:'JERSEY'}</div><h3>${p.name}</h3><b>Rs. ${p.price}</b><button onclick="add(${p.id})">Add to cart</button></article>`).join(''));function add(id){let c=JSON.parse(localStorage.cart||'[]');c.push({id,qty:1});localStorage.cart=JSON.stringify(c);alert('Added to cart')}</script></body></html>
