<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Nepkits Hub</title><link rel="stylesheet" href="style.css"></head><body><main style="max-width:460px;margin:12vh auto;padding:30px"><h1>Nepkits Hub</h1><p>Customer or admin login</p><form id="f"><input name="email" type="email" placeholder="Email" required style="width:100%;padding:14px;margin:8px 0"><input name="password" type="password" placeholder="Password" required style="width:100%;padding:14px;margin:8px 0"><button>Login</button></form><p id="m"></p></main><script>f.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)}),d=await r.json();if(!r.ok)return m.textContent=d.message;localStorage.token=d.token;location.href=d.user.role==='admin'?'admin.html':'/'}</script></body></html>
